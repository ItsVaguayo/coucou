[workspace]
members = ["src-tauri", "hook"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

# Release profile shared by the app and the hook relay: the hook must start fast
# (Claude Code spawns it on every event), so we optimise for size and speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `npm run tauri dev` is how Coucou runs day to day, so the debug build has to be
# usable: dependencies (serde_json, tokio, reqwest/rustls, the keyring crypto,
# wry) optimised, our own crate left quick to rebuild. Line tables only keep
# backtraces readable without a 300 MB binary.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
